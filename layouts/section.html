{{ define "main" }}
  <h1 class="page-title">Archive</h1>
  {{ range .Pages.GroupByDate "2006" }}
    <section class="archive-year">
      <h2>{{ .Key }}</h2>
      <ul class="archive">
        {{ range .Pages }}
        <li>
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan" }}</time>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
        {{ end }}
      </ul>
    </section>
  {{ end }}
{{ end }}
