{{/* Colophon page: framed panels with a BBS status bar.
     Text lives in content/colophon.md; this template adds the decorative chrome. */}}
{{ define "main" }}
<article class="colophon-page">

  <header class="colophon-head">
    <h1 class="page-title">{{ .Title }}</h1>
  </header>

  <div class="prose colophon-body">
    {{ .Content }}
  </div>

  <p class="status-bar" aria-hidden="true">
    <span>F1 HELP</span><span>14400 8N1</span><span>NODE 1</span><span>TIME LEFT: UNLIMITED</span>
  </p>
  <p class="colophon-exit"><a href="{{ "/" | relURL }}">[Q] Return to main menu</a></p>

</article>
{{ end }}
